{% extends 'base.html' %}

{% block content %}

<div class="contenedor">

    <h1>Tareas para hoy</h1>

    <a href="{{ url_for('main.tablero') }}" class="btn">Volver</a>

    <div class="columna">

        {% for tarea in tareas %}
        <div class="card">
            <h3>{{ tarea.titulo }}</h3>
            <p>{{ tarea.descripcion }}</p>
            <p>{{ tarea.prioridad }}</p>
        </div>
        {% else %}
        <p>No hay tareas para hoy</p>
        {% endfor %}

    </div>

</div>

{% endblock %}
